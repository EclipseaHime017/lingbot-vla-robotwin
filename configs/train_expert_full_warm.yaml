# Warm-start full Action Expert BC; run only through scripts/train_warm.py.
# Starts from an earlier run's FP32 export and adds rule-whitelisted data handling:
# same-episode seen instruction resampling, shared photometric jitter (2.1.1),
# small per-view crop/shift/zoom (2.1.1) and proprioception noise (2.1). All 50 clean
# demonstrations per task are used, so manifest/norm statistics cover episodes 0..49.
# The VLM stays frozen; train_expert_full.yaml remains the original recipe.
mode: expert
expert_last_n_layers: -1
init_from: runs/expert-full-clean-5epochs-20261017/checkpoints/global_step_38620/hf_ckpt
base_checkpoint: models/lingbot-vla-v2-6b
qwen_path: models/Qwen3-VL-4B-Instruct
architecture_yaml: vendor/lingbot-vla-v2/configs/vla/robotwin/robotwin.yaml
manifest: data/clean_manifest_all50.json
norm_stats: data/clean_norm_stats_all50.json
output_dir: runs/expert-warm-aug
device: cuda
train_projections: true
batch_size: 16
global_batch_size: 64
gradient_accumulation: 1
require_no_gradient_accumulation: true
fsdp_wrap: decoder_layer
gradient_checkpointing: true
chunk_size: 50
action_chunk_tail: mask
img_size: 256
image_augment: true
image_crop_scale: 0.88
state_noise_std: 0.01
resample_seen_instructions: true
seen_instructions: data/clean_seen_instructions.json
sequence_wise_loss_coeff: 0.001
router_z_loss_coeff: 0.0001
num_workers: 4
val_episodes: 0
seed: 43
lr: 0.00003
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 300
max_steps: 12000
eval_every: 1000
validation_frames_per_episode: 1
save_every: 1000
export: true
export_dtype: float32
