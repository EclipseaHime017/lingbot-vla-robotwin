# Warm-start full Action Expert BC on screened demonstrations; run only through
# scripts/train_warm.py. Starts from the five-epoch export (the best evaluated model)
# and changes as little as possible: the 74 demonstrations flagged by
# configs/demo_filter.json (implausible-IK swings, long detours, single-frame jumps)
# are dropped, the remaining clean episodes 0..49 are all used, seen instructions are
# resampled within each episode, and the learning rate stays low. No image or state
# augmentation, which the five-epoch run did not use either.
# Build data/clean_manifest_filtered.json and its statistics with scripts/filter_demos.py.
mode: expert
expert_last_n_layers: -1
init_from: runs/expert-full-clean-5epochs-20261017/checkpoints/global_step_38620/hf_ckpt
base_checkpoint: models/lingbot-vla-v2-6b
qwen_path: models/Qwen3-VL-4B-Instruct
architecture_yaml: vendor/lingbot-vla-v2/configs/vla/robotwin/robotwin.yaml
manifest: data/clean_manifest_filtered.json
norm_stats: data/clean_norm_stats_filtered.json
output_dir: runs/expert-filter
device: cuda
train_projections: true
batch_size: 16
global_batch_size: 64
gradient_accumulation: 1
require_no_gradient_accumulation: true
fsdp_wrap: decoder_layer
gradient_checkpointing: true
chunk_size: 50
action_chunk_tail: mask
img_size: 256
image_augment: false
resample_seen_instructions: true
seen_instructions: data/clean_seen_instructions.json
sequence_wise_loss_coeff: 0.001
router_z_loss_coeff: 0.0001
num_workers: 4
val_episodes: 0
seed: 45
lr: 0.00001
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 100
max_steps: 6000
eval_every: 1000
validation_frames_per_episode: 1
save_every: 1000
export: true
export_dtype: float32
