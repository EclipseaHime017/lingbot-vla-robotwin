# Stage 1 of the submitted model: the five-epoch full Action Expert run exactly as trained
# (train_expert_full.yaml with 38,620 updates = 5 epochs of 494,328 training frames at global
# batch 64, saved every 2,000 updates). The output directory is the init_from path of
# train_expert_full_filter.yaml, so stage 2 needs no edits. Run with 4 GPUs via torchrun;
# see scripts/reproduce_submission.sh.
mode: expert
expert_last_n_layers: -1
base_checkpoint: models/lingbot-vla-v2-6b
qwen_path: models/Qwen3-VL-4B-Instruct
architecture_yaml: vendor/lingbot-vla-v2/configs/vla/robotwin/robotwin.yaml
manifest: data/clean_manifest.json
norm_stats: data/clean_norm_stats.json
output_dir: runs/expert-full-clean-5epochs-20261017
device: cuda
train_projections: true
batch_size: 16
global_batch_size: 64
gradient_accumulation: 1
require_no_gradient_accumulation: true
fsdp_wrap: decoder_layer
gradient_checkpointing: true
chunk_size: 50
# Retain terminal observations and exclude padded coordinates from the BC loss.
action_chunk_tail: mask
img_size: 256
image_augment: false
# Optional: same-episode seen instructions; create the audited sidecar first.
resample_seen_instructions: false
seen_instructions: data/clean_seen_instructions.json
# Official per-sequence MoE losses (also propagate through LoRA hidden states).
sequence_wise_loss_coeff: 0.001
router_z_loss_coeff: 0.0001
num_workers: 0
val_episodes: 5
seed: 42
lr: 0.00005
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 100
max_steps: 38620
eval_every: 100
validation_frames_per_episode: 1
save_every: 2000
export: true
export_dtype: float32
