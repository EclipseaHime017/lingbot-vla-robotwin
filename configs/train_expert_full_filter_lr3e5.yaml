# Stronger variant of train_expert_full_filter.yaml; run only through scripts/train_warm.py.
# Same start (five-epoch export), screened data (configs/demo_filter.json), seen-instruction
# resampling and no augmentation, but the update budget of round 1
# (train_expert_full_warm.yaml): peak learning rate 3e-5, 300 warm-up updates, 12,000 updates.
# Compared with round 1 it drops only the image/state augmentation (and the 74 screened
# demonstrations), so the two runs separate the effect of augmentation from that of the budget.
mode: expert
expert_last_n_layers: -1
init_from: runs/expert-full-clean-5epochs-20261017/checkpoints/global_step_38620/hf_ckpt
base_checkpoint: models/lingbot-vla-v2-6b
qwen_path: models/Qwen3-VL-4B-Instruct
architecture_yaml: vendor/lingbot-vla-v2/configs/vla/robotwin/robotwin.yaml
manifest: data/clean_manifest_filtered.json
norm_stats: data/clean_norm_stats_filtered.json
output_dir: runs/expert-filter-lr3e5
device: cuda
train_projections: true
batch_size: 16
global_batch_size: 64
gradient_accumulation: 1
require_no_gradient_accumulation: true
fsdp_wrap: decoder_layer
gradient_checkpointing: true
chunk_size: 50
action_chunk_tail: mask
img_size: 256
image_augment: false
resample_seen_instructions: true
seen_instructions: data/clean_seen_instructions.json
sequence_wise_loss_coeff: 0.001
router_z_loss_coeff: 0.0001
num_workers: 4
val_episodes: 0
seed: 46
lr: 0.00003
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 300
max_steps: 12000
eval_every: 1000
validation_frames_per_episode: 1
save_every: 1000
export: true
export_dtype: float32
