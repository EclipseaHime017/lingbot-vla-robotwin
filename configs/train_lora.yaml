# Supervised clean-only BC. Frozen VLM + action attention LoRA + action/state projections.
# bf16 SDPA weights; FP32 trainables/AdamW. Actual peak memory must be measured.
mode: lora
base_checkpoint: models/lingbot-vla-v2-6b
qwen_path: models/Qwen3-VL-4B-Instruct
architecture_yaml: vendor/lingbot-vla-v2/configs/vla/robotwin/robotwin.yaml
manifest: data/clean_manifest.json
norm_stats: data/clean_norm_stats.json
output_dir: runs/lora_clean
device: cuda
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.0
lora_targets: [q_proj, k_proj, v_proj, o_proj]
train_projections: true
batch_size: 1
gradient_accumulation: 16
gradient_checkpointing: true
chunk_size: 50
# mask: retain terminal observations; drop: train only full 50-action windows.
# Validation always retains all observations with padded targets masked out.
action_chunk_tail: mask
img_size: 256
image_augment: false
num_workers: 0
val_episodes: 5
seed: 42
lr: 0.0001
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 100
max_steps: 1000
eval_every: 100
eval_batches: 8
save_every: 100
export: true
export_dtype: bfloat16
