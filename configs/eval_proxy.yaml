# Diagnostic proxy: 12 tasks x 2 settings x 20 scenes = 480 scenes.
# Same layout as eval_parallel.yaml: never more than one simulator beside an
# FP32 policy server. This layout still took a cluster node down on 2026-10-23.
tasks:
  - adjust_bottle
  - click_bell
  - place_a2b_left
  - place_a2b_right
  - shake_bottle
  - shake_bottle_horizontally
  - stack_blocks_three
  - blocks_ranking_rgb
  - put_bottles_dustbin
  - open_microwave
  - hanging_mug
  - stamp_seal
settings: [demo_clean, demo_randomized]
trials: 20
backend: native
precision: fp32
use_length: 50
num_steps: 10
compile: false
action_smoothing: none
sim_workers: 4
sim_layout:
  server_gpus: 2
  sims_on_server_gpu: 1
  sims_per_sim_gpu: 3
policy_rng: scene
expert_cache_mode: "off"
