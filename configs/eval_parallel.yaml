tasks: all
settings: [demo_clean, demo_randomized]
trials: 100
backend: native
precision: fp32
use_length: 50
num_steps: 10
compile: false
action_smoothing: none
# Per 4-GPU node: two FP32 policy GPUs (~25 GB server + 1 simulator ~9 GB each)
# and two simulator-only GPUs (3 simulators each). Two simulators beside one
# FP32 server exceed a 40 GB A100. Parallel runs took cluster nodes down four
# times on 2026-10-22/23, this layout included at 24.9 GB per GPU; cause unknown.
sim_workers: 4
sim_layout:
  server_gpus: 2
  sims_on_server_gpu: 1
  sims_per_sim_gpu: 3
policy_rng: scene
expert_cache_mode: "off"
