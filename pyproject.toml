[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lingbot-vla-robotwin-local"
version = "0.1.0"
description = "Clean-only LingBot-VLA 2.0 post-training and RoboTwin competition tools"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 119
target-version = "py310"
